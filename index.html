<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">My Library</div>
    <div class="main">
        <button id="add">+ Add Book</button>
        <form class="pop_up" style="display: none;">
            <div class="top">Add A New Book</div>
            <label for="title">Title</label>
            <input type="text" id="title" required>
            <label for="author">Author</label>
            <input type="text" id="author" required>
            <label for="pages">Pages</label>
            <input type="text" id="pages" required>
            <div class="read">Not Read</div>            
            <button class="submitting">Submit</button>            
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
